name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "prototype/**"
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "prototype/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Record resolved tool versions
        run: |
          node --version
          npm --version
          npx tsc --version

      - name: Run TypeScript compiler
        run: npm run typecheck

  test:
    name: Tests (Vitest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Makes tests/global-setup.ts use the service below instead of spawning a Docker container
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Record resolved tool versions
        run: |
          node --version
          npm --version
          npx vitest --version

      - name: Run test suite
        run: npm test

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build application
        run: npm run build

  docker:
    name: Docker image build
    needs: [typecheck, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Single required status check for branch protection. Jobs above can be
  # added, renamed or split without touching the repository rules.
  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [typecheck, test, build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::At least one required job did not succeed."
              exit 1
            fi
          done
